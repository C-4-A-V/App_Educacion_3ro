# Perfil opcional para una base MySQL local o de prueba separada de H2.
# Se deben definir las tres variables antes de iniciar Spring.
spring.datasource.url=${MPAZ_MYSQL_URL}
spring.datasource.username=${MPAZ_MYSQL_USUARIO}
spring.datasource.password=${MPAZ_MYSQL_CLAVE}
spring.jpa.hibernate.ddl-auto=update
